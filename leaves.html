<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natural Ghibli Leaf Drift - PASO Solarpunk</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #1b261f;
        }

        /* Background Solarpunk Landscape Layer */
        .solarpunk-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover;
            z-index: 0;
        }

        /* Warm Golden-Hour Lighting Filter */
        .overlay-glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 15% 20%, rgba(255, 204, 102, 0.4) 0%, rgba(43, 85, 58, 0.25) 50%, rgba(15, 25, 20, 0.65) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* UI Layer */
        .content-layer {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #f4f7f2;
            text-align: center;
            padding: 20px;
            pointer-events: none;
        }

        .glass-card {
            background: rgba(25, 38, 30, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px 50px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            pointer-events: auto;
            max-width: 600px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #ffd166;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            font-family: Georgia, serif;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: #d8f3dc;
            line-height: 1.6;
        }

        .action-btn {
            background: linear-gradient(135deg, #52b788, #2d6a4f);
            color: #ffffff;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(45, 106, 79, 0.4);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(82, 183, 136, 0.6);
            background: linear-gradient(135deg, #74c69d, #40916c);
        }

        /* --- NATURAL FALLING LEAVES CONTAINER & PHYSICS --- */
        #leaf-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Allows clicks to pass through */
            overflow: hidden;
            z-index: 5;
        }

        .falling-leaf {
            position: absolute;
            top: -60px;
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.9;
            animation-name: naturalFall, organicSway;
            animation-timing-function: linear, ease-in-out;
            animation-iteration-count: infinite, infinite;
            will-change: transform, top, left;
        }

        /* Natural falling trajectory with gentle gravity acceleration */
        @keyframes naturalFall {
            0% {
                top: -60px;
            }
            100% {
                top: 105vh;
            }
        }

        /* Organic pendular side-to-side swaying combined with subtle 3D tumbling rotation */
        @keyframes organicSway {
            0% {
                transform: translateX(0px) rotateZ(0deg) rotateY(0deg);
            }
            25% {
                transform: translateX(35px) rotateZ(25deg) rotateY(45deg);
            }
            50% {
                transform: translateX(-15px) rotateZ(10deg) rotateY(90deg);
            }
            75% {
                transform: translateX(45px) rotateZ(-15deg) rotateY(135deg);
            }
            100% {
                transform: translateX(0px) rotateZ(0deg) rotateY(180deg);
            }
        }
    </style>
</head>
<body>

    <!-- Background Layer -->
    <div class="solarpunk-bg"></div>
    <div class="overlay-glow"></div>

    <!-- Leaf Container -->
    <div id="leaf-container"></div>

    <!-- UI Content Layer -->
    <main class="content-layer">
        <div class="glass-card">
            <h1>PASO Sol-Bayanihan</h1>
            <p>Drifting through an overgrown eco-futurist tropical canopy under a warm golden sun.</p>
            <button class="action-btn" onclick="triggerLeafBurst()">
                <!-- SVG Icon (No Emojis) -->
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path>
                    <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.5 12 13 13 12"></path>
                </svg>
                Stir the Canopy Breeze
            </button>
        </div>
    </main>

    <script>
        const leafContainer = document.getElementById('leaf-container');

        // Natural Ghibli color palette matching the reference image (golden-lit greens, warm olive, and sun-kissed amber)
        const leafColors = [
            '#a3be48', '#85a939', '#558234', '#386641', 
            '#d4a373', '#ccd5ae', '#e9c46a', '#e76f51'
        ];

        // Generates an inline SVG matching the exact elongated teardrop/lanceolate shape from your reference image
        function createReferenceLeafSVG(color) {
            const svgString = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 48" fill="${color}">
                <path d="M16 1C16 1 31 14 31 27C31 36.3888 24.2843 44 16 44C7.71573 44 1 36.3888 1 27C1 14 16 1 16 1Z" opacity="0.95"/>
                <path d="M16 4C16 4 27 15 27 27C27 34 22 41 16 42" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.3" fill="none"/>
            </svg>`;
            return `url("data:image/svg+xml;utf8,${encodeURIComponent(svgString)}")`;
        }

        function spawnLeaf() {
            const leaf = document.createElement('div');
            leaf.classList.add('falling-leaf');

            // Spawn concentrated around the top-left corner (0% to 45% screen width) where the acacia tree is located
            const startX = Math.random() * (window.innerWidth * 0.45);
            
            // Random organic sizing (width: 16px to 32px, height scaled proportionally)
            const width = Math.floor(Math.random() * 16) + 16;
            const height = width * 1.5;
            
            // Realistic falling speed (6 seconds to 13 seconds)
            const fallDuration = (Math.random() * 7 + 6).toFixed(2);
            
            // Sway cycle duration (4 seconds to 8 seconds)
            const swayDuration = (Math.random() * 4 + 4).toFixed(2);

            // Pick a random natural sunlit color
            const color = leafColors[Math.floor(Math.random() * leafColors.length)];

            leaf.style.left = `${startX}px`;
            leaf.style.width = `${width}px`;
            leaf.style.height = `${height}px`;
            leaf.style.backgroundImage = createReferenceLeafSVG(color);
            
            // Apply dual animations for falling and swaying physics
            leaf.style.animationDuration = `${fallDuration}s, ${swayDuration}s`;
            leaf.style.animationDelay = `${Math.random() * 4}s, ${Math.random() * 2}s`;

            leafContainer.appendChild(leaf);

            // Performance: Clean up DOM element after it falls out of view
            setTimeout(() => {
                leaf.remove();
            }, parseFloat(fallDuration) * 1000 + 2000);
        }

        // Initialize background leaves
        const maxLeaves = 22;
        for (let i = 0; i < maxLeaves; i++) {
            setTimeout(spawnLeaf, Math.random() * 5000);
        }
        setInterval(spawnLeaf, 700);

        // Burst effect when clicking the button
        function triggerLeafBurst() {
            for (let i = 0; i < 18; i++) {
                setTimeout(spawnLeaf, i * 60);
            }
        }
    </script>
</body>
</html>
