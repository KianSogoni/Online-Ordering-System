<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solarpunk Terracotta Pot - 3D Ghibli Interactive Render</title>
    <!-- Tailwind CSS for modern UI design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js & OrbitControls for 3D WebGL rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        .heading-font {
            font-family: 'Fredoka', cursive;
        }

        /* Glassmorphism panel styling */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        /* Custom UI Sliders */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: #e2e8f0;
            height: 6px;
            border-radius: 4px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #2b704c;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: transform 0.15s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        /* Canvas full viewport */
        #renderCanvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-800">

    <!-- 3D WebGL Canvas Container -->
    <canvas id="renderCanvas"></canvas>

    <!-- Top Floating Header Info -->
    <header class="fixed top-6 left-6 z-20 pointer-events-none">
        <div class="glass-panel px-5 py-3.5 rounded-3xl shadow-xl flex items-center gap-3.5 pointer-events-auto">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-[#d96b43] to-[#e88d67] flex items-center justify-center text-white text-xl shadow-md">
                🏺
            </div>
            <div>
                <h1 class="heading-font text-xl font-semibold text-slate-900 leading-tight">PASO · Solarpunk Pot</h1>
                <p class="text-xs text-emerald-700 font-semibold flex items-center gap-1">
                    <i class="fa-solid fa-leaf text-[10px]"></i> Studio Ghibli 3D Render
                </p>
            </div>
        </div>
    </header>

    <!-- Interactive Controls Drawer / Panel -->
    <div class="fixed top-6 right-6 z-20 max-w-xs w-full">
        <div class="glass-panel p-5 rounded-3xl shadow-2xl space-y-5 border border-white/80">
            <div class="flex items-center justify-between pb-3 border-b border-slate-200/80">
                <span class="heading-font text-lg font-semibold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-emerald-600"></i> Render Controls
                </span>
                <span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold">3D Realtime</span>
            </div>

            <!-- Control 1: Turntable Auto Rotation -->
            <div class="flex items-center justify-between">
                <label for="autoRotateToggle" class="text-xs font-semibold text-slate-700 flex items-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-rotate text-slate-400"></i> Auto Turntable
                </label>
                <button id="autoRotateToggle" onclick="toggleAutoRotate()" class="w-12 h-6 bg-emerald-600 rounded-full p-1 transition-colors duration-200 flex items-center shadow-inner">
                    <div id="rotateIndicator" class="w-4 h-4 bg-white rounded-full shadow-md transform translate-x-6 transition-transform duration-200"></div>
                </button>
            </div>

            <!-- Control 2: Lighting Environment Preset -->
            <div class="space-y-1.5">
                <label class="text-xs font-semibold text-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-sun text-amber-500"></i> Atmosphere Lighting
                </label>
                <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100/80 rounded-2xl">
                    <button id="btnDay" onclick="setLightingMode('day')" class="py-1.5 px-3 rounded-xl text-xs font-bold transition-all shadow-sm bg-white text-slate-800">
                        ☀️ Studio Day
                    </button>
                    <button id="btnSunset" onclick="setLightingMode('sunset')" class="py-1.5 px-3 rounded-xl text-xs font-bold text-slate-500 hover:text-slate-800 transition-all">
                        🌅 Ghibli Sunset
                    </button>
                </div>
            </div>

            <!-- Control 3: Moss Density Slider -->
            <div class="space-y-1.5">
                <div class="flex justify-between text-xs font-semibold text-slate-700">
                    <span class="flex items-center gap-2"><i class="fa-solid fa-seedling text-emerald-600"></i> Moss Density</span>
                    <span id="mossValueText" class="text-emerald-700">75%</span>
                </div>
                <input type="range" id="mossSlider" min="0" max="100" value="75" oninput="updateMossDensity(this.value)" class="w-full">
            </div>

            <!-- Control 4: Vine & Foliage Growth Slider -->
            <div class="space-y-1.5">
                <div class="flex justify-between text-xs font-semibold text-slate-700">
                    <span class="flex items-center gap-2"><i class="fa-solid fa-plant-wilt text-emerald-600"></i> Vine Growth</span>
                    <span id="vineValueText" class="text-emerald-700">100%</span>
                </div>
                <input type="range" id="vineSlider" min="0" max="100" value="100" oninput="updateVineGrowth(this.value)" class="w-full">
            </div>

            <!-- Action Button: Snapshot -->
            <button onclick="takeSnapshot()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-700 hover:from-emerald-500 hover:to-teal-600 text-white font-semibold py-2.5 rounded-2xl shadow-lg transition-all duration-200 flex items-center justify-center gap-2 text-xs">
                <i class="fa-solid fa-camera"></i> Capture High-Res Snapshot
            </button>
        </div>
    </div>

    <!-- Bottom Center Helper Cue -->
    <div class="fixed bottom-6 inset-x-0 flex justify-center pointer-events-none z-10">
        <div class="glass-panel px-4 py-2 rounded-full shadow-lg text-xs text-slate-600 font-medium flex items-center gap-2 pointer-events-auto border border-white">
            <span>🖱️ Drag to Orbit</span>
            <span class="text-slate-300">•</span>
            <span>🔍 Scroll to Zoom</span>
            <span class="text-slate-300">•</span>
            <span>✨ Solarpunk Airborne Spores Active</span>
        </div>
    </div>

    <!-- Snapshot Toast Notification -->
    <div id="toast" class="fixed bottom-20 left-1/2 transform -translate-x-1/2 z-30 transition-all duration-300 opacity-0 translate-y-4 pointer-events-none">
        <div class="bg-slate-900 text-white px-5 py-2.5 rounded-2xl shadow-2xl text-xs font-semibold flex items-center gap-2">
            <i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
            <span>Snapshot downloaded successfully!</span>
        </div>
    </div>

    <!-- MAIN THREE.JS 3D RENDER ENGINE SCRIPT -->
    <script>
        // Global variables for Three.js
        let scene, camera, renderer, controls;
        let potGroup, mossMeshGroup, vineMeshGroup, sporesParticleSystem;
        let dirLight, ambientLight, rimLight, floorMesh;
        
        // Interactive state flags
        let isAutoRotate = true;
        let lightingMode = 'day';
        let mossDensity = 0.75;
        let vineGrowth = 1.0;

        // Custom Terracotta Material
        let terracottaMaterial, mossMaterial, leafMaterial, stemMaterial;

        // Initialize 3D Engine
        window.addEventListener('load', () => {
            initScene();
            createEnvironment();
            createTerracottaPot();
            createMossAndVines();
            createAirborneSpores();
            setupEvents();
            animate();
        });

        // Initialize Scene, Camera, and Renderer
        function initScene() {
            const canvas = document.getElementById('renderCanvas');
            
            // Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf5f7fa); // Clean soft background

            // Isometric Camera Perspective Setup
            const aspect = window.innerWidth / window.innerHeight;
            camera = new THREE.PerspectiveCamera(32, aspect, 0.1, 100);
            camera.position.set(7.5, 6, 7.5); // Isometric viewing angle

            // WebGL Renderer Setup with Shadow Mapping
            renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                antialias: true,
                preserveDrawingBuffer: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.1;

            // Orbit Controls setup
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; // Prevent camera going below floor
            controls.minDistance = 4;
            controls.maxDistance = 18;
            controls.target.set(0, 0.8, 0);
            controls.autoRotate = true;
            controls.autoRotateSpeed = 2.0;

            // Root Group for Entire Model
            potGroup = new THREE.Group();
            scene.add(potGroup);
        }

        // Lighting & Soft Studio Environment Setup
        function createEnvironment() {
            // Soft Ambient Light for Ghibli aesthetic fill
            ambientLight = new THREE.AmbientLight(0xfff5ea, 1.2);
            scene.add(ambientLight);

            // Key Sun/Studio Directional Light
            dirLight = new THREE.DirectionalLight(0xfffaed, 2.2);
            dirLight.position.set(6, 10, 5);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 25;
            dirLight.shadow.camera.left = -4;
            dirLight.shadow.camera.right = 4;
            dirLight.shadow.camera.top = 4;
            dirLight.shadow.camera.bottom = -4;
            dirLight.shadow.bias = -0.0005;
            scene.add(dirLight);

            // Subtle Warm Rim Light for Stylized Highlights
            rimLight = new THREE.DirectionalLight(0x70e0ff, 0.8);
            rimLight.position.set(-6, 4, -5);
            scene.add(rimLight);

            // Studio Soft Shadow Receiver Floor
            const floorGeo = new THREE.PlaneGeometry(30, 30);
            const floorMat = new THREE.ShadowMaterial({
                opacity: 0.12
            });
            floorMesh = new THREE.Mesh(floorGeo, floorMat);
            floorMesh.rotation.x = -Math.PI / 2;
            floorMesh.position.y = 0;
            floorMesh.receiveShadow = true;
            scene.add(floorMesh);
        }

        // Procedural Creation of the Terracotta Pot
        function createTerracottaPot() {
            // Earthy Terracotta Material with subtle roughness
            terracottaMaterial = new THREE.MeshStandardMaterial({
                color: 0xd66843, // Earthy orange-brown terracotta color
                roughness: 0.85,
                metalness: 0.05,
                bumpScale: 0.015
            });

            // 1. Pot Body (Lathe Geometry for Smooth Organic Curves)
            const points = [];
            points.push(new THREE.Vector2(0.35, 0.05));  // Bottom Base
            points.push(new THREE.Vector2(0.55, 0.1));   // Lower curve
            points.push(new THREE.Vector2(1.15, 0.85));  // Belly widest point
            points.push(new THREE.Vector2(0.85, 1.6));   // Neck waist
            points.push(new THREE.Vector2(0.95, 1.75));  // Upper Rim Lip Outward
            points.push(new THREE.Vector2(0.82, 1.78));  // Inner Lip Edge
            points.push(new THREE.Vector2(0.75, 1.55));  // Inner Wall Depth

            const potGeo = new THREE.LatheGeometry(points, 64);
            const potMesh = new THREE.Mesh(potGeo, terracottaMaterial);
            potMesh.castShadow = true;
            potMesh.receiveShadow = true;
            potGroup.add(potMesh);

            // 2. Carved Rustic Relief Pattern / "PASO" Text Band Ring
            const ringGeo = new THREE.CylinderGeometry(1.02, 1.08, 0.28, 64);
            const ringMat = new THREE.MeshStandardMaterial({
                color: 0xc45733,
                roughness: 0.9,
                bumpScale: 0.03
            });
            const ringMesh = new THREE.Mesh(ringGeo, ringMat);
            ringMesh.position.y = 1.15;
            ringMesh.castShadow = true;
            ringMesh.receiveShadow = true;
            potGroup.add(ringMesh);

            // 3. Inner Dark Soil Inside the Pot
            const soilGeo = new THREE.CylinderGeometry(0.78, 0.7, 0.2, 32);
            const soilMat = new THREE.MeshStandardMaterial({
                color: 0x3d281d,
                roughness: 0.95,
                metalness: 0.0
            });
            const soilMesh = new THREE.Mesh(soilGeo, soilMat);
            soilMesh.position.y = 1.55;
            potGroup.add(soilMesh);
        }

        // Procedural Moss Patches and Vines wrapping around the pot
        function createMossAndVines() {
            mossMeshGroup = new THREE.Group();
            vineMeshGroup = new THREE.Group();
            potGroup.add(mossMeshGroup);
            potGroup.add(vineMeshGroup);

            // Vibrant Ghibli Moss Material
            mossMaterial = new THREE.MeshStandardMaterial({
                color: 0x48a05b,
                roughness: 0.9,
                metalness: 0.0,
                flatShading: true
            });

            // Leaf Material
            leafMaterial = new THREE.MeshStandardMaterial({
                color: 0x3cb065,
                roughness: 0.5,
                metalness: 0.1,
                side: THREE.DoubleSide
            });

            // Stem/Vine Material
            stemMaterial = new THREE.MeshStandardMaterial({
                color: 0x2b704c,
                roughness: 0.7,
                metalness: 0.0
            });

            // A. Generate Organic Moss Clusters around pot base and rim
            const mossClusterCount = 65;
            for (let i = 0; i < mossClusterCount; i++) {
                const mossBlob = new THREE.Mesh(
                    new THREE.DodecahedronGeometry(0.08 + Math.random() * 0.12, 1),
                    mossMaterial
                );

                // Position moss on pot surface based on angle and height
                const angle = Math.random() * Math.PI * 2;
                const heightFraction = Math.random();
                let radius = 0.5 + heightFraction * 0.5;
                if (heightFraction > 0.4 && heightFraction < 0.7) radius = 1.05; // Pot belly

                mossBlob.position.set(
                    Math.cos(angle) * radius * 0.98,
                    0.1 + heightFraction * 1.5,
                    Math.sin(angle) * radius * 0.98
                );

                mossBlob.scale.set(1 + Math.random(), 0.5 + Math.random() * 0.5, 1 + Math.random());
                mossBlob.rotation.set(Math.random(), Math.random(), Math.random());
                mossBlob.castShadow = true;
                mossBlob.receiveShadow = true;
                mossMeshGroup.add(mossBlob);
            }

            // B. Generate 3D Vines wrapping around the body
            const vineCurves = [
                // Vine 1: Spiral upwards
                [
                    new THREE.Vector3(0.55, 0.1, 0.1),
                    new THREE.Vector3(0.95, 0.5, 0.5),
                    new THREE.Vector3(1.15, 1.0, 0.1),
                    new THREE.Vector3(0.9, 1.4, -0.4),
                    new THREE.Vector3(0.95, 1.7, 0.2)
                ],
                // Vine 2: Side draping
                [
                    new THREE.Vector3(-0.5, 0.15, -0.2),
                    new THREE.Vector3(-1.1, 0.7, 0.3),
                    new THREE.Vector3(-0.85, 1.3, 0.5),
                    new THREE.Vector3(-0.95, 1.72, -0.1)
                ]
            ];

            vineCurves.forEach(controlPoints => {
                const curve = new THREE.CatmullRomCurve3(controlPoints);
                const tubeGeo = new THREE.TubeGeometry(curve, 40, 0.025, 8, false);
                const vineStem = new THREE.Mesh(tubeGeo, stemMaterial);
                vineStem.castShadow = true;
                vineMeshGroup.add(vineStem);

                // Add stylized leaves along the vine curve
                const pointsOnCurve = curve.getSpacedPoints(18);
                pointsOnCurve.forEach((pt, index) => {
                    if (index === 0) return;

                    const leafGroup = new THREE.Group();
                    leafGroup.position.copy(pt);

                    // Heart-shaped/Oval Leaf Geometry
                    const leafShape = new THREE.Shape();
                    leafShape.moveTo(0, 0);
                    leafShape.bezierCurveTo(0.08, 0.08, 0.12, 0.2, 0, 0.32);
                    leafShape.bezierCurveTo(-0.12, 0.2, -0.08, 0.08, 0, 0);

                    const leafGeo = new THREE.ShapeGeometry(leafShape);
                    const leafMesh = new THREE.Mesh(leafGeo, leafMaterial);
                    leafMesh.scale.setScalar(0.7 + Math.random() * 0.5);
                    leafMesh.rotation.x = Math.random() * Math.PI;
                    leafMesh.rotation.y = Math.random() * Math.PI;
                    leafMesh.castShadow = true;

                    leafGroup.add(leafMesh);
                    vineMeshGroup.add(leafGroup);
                });
            });
        }

        // Floating Airborne Glowing Spores/Pollen (Ghibli Aesthetic)
        function createAirborneSpores() {
            const sporeCount = 45;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(sporeCount * 3);
            const scales = new Float32Array(sporeCount);

            for (let i = 0; i < sporeCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 6;
                positions[i * 3 + 1] = Math.random() * 4;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 6;
                scales[i] = Math.random() * 0.06 + 0.02;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            // Soft glowing particle material
            const sporeMaterial = new THREE.PointsMaterial({
                color: 0x88f0a8,
                size: 0.08,
                transparent: true,
                opacity: 0.75,
                blending: THREE.AdditiveBlending
            });

            sporesParticleSystem = new THREE.Points(geometry, sporeMaterial);
            scene.add(sporesParticleSystem);
        }

        // --- Interactive Controls & Event Callbacks ---

        // Toggle Auto Turntable Rotation
        function toggleAutoRotate() {
            isAutoRotate = !isAutoRotate;
            controls.autoRotate = isAutoRotate;
            const indicator = document.getElementById('rotateIndicator');
            const btn = document.getElementById('autoRotateToggle');

            if (isAutoRotate) {
                btn.className = "w-12 h-6 bg-emerald-600 rounded-full p-1 transition-colors duration-200 flex items-center shadow-inner";
                indicator.className = "w-4 h-4 bg-white rounded-full shadow-md transform translate-x-6 transition-transform duration-200";
            } else {
                btn.className = "w-12 h-6 bg-slate-300 rounded-full p-1 transition-colors duration-200 flex items-center shadow-inner";
                indicator.className = "w-4 h-4 bg-white rounded-full shadow-md transform translate-x-0 transition-transform duration-200";
            }
        }

        // Switch Atmosphere Lighting Preset (Studio Day vs Ghibli Sunset)
        function setLightingMode(mode) {
            lightingMode = mode;
            const btnDay = document.getElementById('btnDay');
            const btnSunset = document.getElementById('btnSunset');

            if (mode === 'day') {
                scene.background.set(0xf5f7fa);
                dirLight.color.set(0xfffaed);
                dirLight.intensity = 2.2;
                ambientLight.color.set(0xfff5ea);
                ambientLight.intensity = 1.2;
                rimLight.color.set(0x70e0ff);

                btnDay.className = "py-1.5 px-3 rounded-xl text-xs font-bold transition-all shadow-sm bg-white text-slate-800";
                btnSunset.className = "py-1.5 px-3 rounded-xl text-xs font-bold text-slate-500 hover:text-slate-800 transition-all";
            } else {
                // Sunset Atmosphere
                scene.background.set(0xfff4eb);
                dirLight.color.set(0xff8c42);
                dirLight.intensity = 2.8;
                ambientLight.color.set(0xffd1b3);
                ambientLight.intensity = 1.0;
                rimLight.color.set(0xffd700);

                btnSunset.className = "py-1.5 px-3 rounded-xl text-xs font-bold transition-all shadow-sm bg-white text-slate-800";
                btnDay.className = "py-1.5 px-3 rounded-xl text-xs font-bold text-slate-500 hover:text-slate-800 transition-all";
            }
        }

        // Adjust Moss Density Slider
        function updateMossDensity(val) {
            mossDensity = val / 100;
            document.getElementById('mossValueText').innerText = `${val}%`;
            mossMeshGroup.scale.setScalar(mossDensity === 0 ? 0.0001 : mossDensity);
        }

        // Adjust Vine Growth Slider
        function updateVineGrowth(val) {
            vineGrowth = val / 100;
            document.getElementById('vineValueText').innerText = `${val}%`;
            vineMeshGroup.scale.setScalar(vineGrowth === 0 ? 0.0001 : vineGrowth);
        }

        // Capture High-Res Canvas Snapshot
        function takeSnapshot() {
            // Render one frame cleanly
            renderer.render(scene, camera);
            const dataURL = renderer.domElement.toDataURL('image/png');

            // Download Anchor Trigger
            const link = document.createElement('a');
            link.download = `Solarpunk-PASO-Terracotta-Render.png`;
            link.href = dataURL;
            link.click();

            // Show Toast Notification
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-4');
            }, 3000);
        }

        // Handle Window Resizing
        function setupEvents() {
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // Animation Loop (60 FPS)
        function animate() {
            requestAnimationFrame(animate);

            // Orbit controls update
            controls.update();

            // Gentle floating motion for airborne spores
            if (sporesParticleSystem) {
                const positions = sporesParticleSystem.geometry.attributes.position.array;
                for (let i = 0; i < positions.length; i += 3) {
                    positions[i + 1] += Math.sin(Date.now() * 0.001 + positions[i]) * 0.002;
                }
                sporesParticleSystem.geometry.attributes.position.needsUpdate = true;
            }

            // Subtle gentle breeze swaying on leaves
            if (vineMeshGroup) {
                vineMeshGroup.rotation.y = Math.sin(Date.now() * 0.0008) * 0.03;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
